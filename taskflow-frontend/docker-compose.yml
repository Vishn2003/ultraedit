version: '3.8'
services:
  mock-api:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "4000:4000"
    command: sh -c "npm install && node server.cjs"

  frontend:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - mock-api
    environment:
      - VITE_API_URL=http://localhost:4000
